<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторна робота № 8 - Гра «Більше число»</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1 id="title">Гра: Більше число</h1>
        
        <div class="game-area">
            <div class="player-card">
                <div class="player-name" id="userNameLabel">User</div>
                <div class="score-box" id="userScore">0</div>
                <div class="number-circle" id="userNumber">?</div>
            </div>

            <div class="player-card">
                <div class="player-name">Computer</div>
                <div class="score-box" id="computerScore">0</div>
                <div class="number-circle" id="computerNumber">?</div>
            </div>
        </div>

        <button class="btn-generate" id="generateBtn">Generate</button>
        
        <div id="message">Натисніть "Generate", щоб розпочати гру!</div>
        
        <button class="reset-btn" id="resetBtn">Грати знову</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
